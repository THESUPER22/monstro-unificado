name: Monstro CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies (CI-safe, sem MetaTrader5 que e Windows-only)
      run: |
        pip install --upgrade pip
        # flask/requests: necessarios para tests/test_fluxo_api_contrato.py
        # (dashboard_routes -> flask; sentinela_fluxo -> requests)
        pip install pytest pandas numpy requests flask
        # TensorFlow opcional - se falhar, testes de ML sao pulados
        pip install tensorflow>=2.13.0 2>/dev/null || echo "TensorFlow indisponivel no CI - pulando"
    - name: Syntax check (py_compile)
      run: |
        python -m py_compile \
          monstro_unificado_v22.py \
          rompimento_orquestrador.py \
          agente_monstro_core.py \
          dashboard_routes.py \
          sentinela_fluxo.py \
          selecao_estrategia_regime.py \
          config_manager.py \
          fluxo_tempo_real.py \
          fluxo_mt5_adapter.py \
          coletor_herman_6p_shadow.py \
          rompimento_ft.py \
          monitor_saude_coletores.py \
          backtest_orb_wdo.py \
          tests/test_fluxo_tempo_real.py \
          tests/test_fluxo_api_contrato.py \
          tests/test_fluxo_mt5_adapter.py
    - name: Testes sem dependencia de MT5 (fluxo tempo real)
      run: |
        python -m pytest tests/test_fluxo_tempo_real.py tests/test_fluxo_api_contrato.py tests/test_fluxo_mt5_adapter.py -q
    - name: Testes legados (best-effort, nao bloqueante)
      continue-on-error: true
      run: |
        python tests/testes_pos_fix.py || true
        python tests/teste_orquestrador_rompimento.py || true
